# daemon/outreach/pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach"
version = "0.1.0"
description = "Autonomous outreach toolkit (clawd-bot daemon)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "click>=8.1",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
    "dnspython>=2.6",   # MX-record check in pre-send address verification
    "requests>=2.31",   # outlet-page substring check + Hunter.io verifier
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb,ses,s3,ssm]>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
outreach = "outreach.cli:main"

[tool.setuptools.packages.find]
include = ["outreach*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
